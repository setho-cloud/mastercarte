<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MasterCarte — Connexion</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">
    <section class="card" aria-label="Connexion MasterCarte">
      <header class="header">
        <h1 class="title">MasterCarte</h1>
        <p class="subtitle">Connexion</p>
      </header>

      <form id="loginForm" class="form" autocomplete="on" novalidate>
        <label class="field">
          <span class="label">Email</span>
          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="ex: gerant@bar.com"
            required
          />
          <span id="emailError" class="error" hidden>
          </span>
        </label>

        <label class="field">
          <span class="label">Mot de passe</span>
          <div class="password">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Votre mot de passe"
              required
              minlength="4"
            />
            <button type="button" id="togglePwd" class="ghost" aria-label="Afficher/masquer le mot de passe">
              Afficher
            </button>
          </div>
        </label>

        <div id="errorBox" class="alert" role="alert" hidden></div>

        <button id="submitBtn" class="primary" type="submit">
          Se connecter
        </button>

        <div class="help">
          <a href="#" class="link" id="forgotLink">Mot de passe oublié ?</a>
        </div>

        <footer class="footer">
          <small>© MasterCarte</small>
        </footer>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
