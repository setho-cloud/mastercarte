<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartCarte — Menu Digital</title>
    <link rel="stylesheet" href="smartcarte.css">
</head>
<body>

    <div class="master-header-fixed">
        <header class="catalogue-topbar">
            <div class="catalogue-topbar-inner">
                <button class="btn-back" type="button" onclick="window.close()">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>

                <div class="title-group">
                    <h1 id="mainEtabTitle" class="catalogue-title">CHARGEMENT...</h1>
                    <p id="subGerantName" class="catalogue-subtitle">Menu Digital Officiel</p>
                </div>

                <div style="width: 40px;"></div>
            </div>
        </header>
    </div>

    <section class="catalogue-toolbar">
        <div class="search-wrap">
            <span class="search-ico">🔎</span>
            <input id="searchInput" class="search-input" type="search" placeholder="Rechercher une boisson..." autocomplete="off" />
        </div>
        
        <nav class="menu-wrapper">
            <div class="menu-scroll" id="categoryNav"></div>
        </nav>
    </section>

    <main id="mainCatalogue" class="catalogue-content">
        </main>
    
   <section id="wifiSection" class="wifi-container-sultan" style="display: none;">
    <button id="btnGetWifi" class="wifi-black-badge">
        <span class="wifi-label">WI-FI :</span>
        <span id="wifiNetName" class="wifi-ssid">NOM</span>
        <span class="wifi-divider">|</span>
        <span id="wifiPassVal" class="wifi-pass">MDP</span>
        <svg class="icon-copy-white" viewBox="0 0 24 24" width="14" height="14">
            <path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
        </svg>
    </button>
</section>

    <script src="smartcarte.js"></script>
</body>
</html>
